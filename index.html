<style>

ttom:22px}.card,.panel{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:24px}.card:first-child{background:linear-gradient(135deg,#282344,#17203a);border-color:#4a426d}.card .value{font-size:clamp(20px,2vw,30px);font-weight:700;margin:17px 0 8px;letter-spacing:-1px}.income{color:var(--green)}.expense{color:var(--red)}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}.panel h2{font-size:17px;margin:0 0 20px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress{height:10px;background:#292e45;border-radius:8px;overflow:hidden;margin:22px 0 14px}.progress span{display:block;height:100%;background:var(--purple);border-radius:8px}.notice{padding:14px;border-radius:10px;background:#25213f;line-height:1.7}.empty{text-align:center;padding:48px 16px;color:var(--muted);line-height:1.9}.empty .symbol{font-size:35px;color:#786da9;margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-title{font-weight:600;margin-bottom:6px}.row-actions{display:flex;gap:7px;align-items:center}.row-actions button{font-size:12px;padding:7px 10px}.amount{font-weight:700;white-space:nowrap}.badge{background:#242a42;padding:4px 8px;border-radius:6px;font-size:11px;color:#b5bfd7}.chart-wrap{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap}.donut{width:230px;height:230px;border-radius:50%;position:relative;display:grid;place-items:center}.donut:before{content:"";position:absolute;inset:30px;background:var(--panel);border-radius:50%}.donut-center{position:relative;text-align:center}.donut-center strong{display:block;font-size:23px;margin-top:8px}.legend{flex:1;min-width:190px}.dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:9px}.filters{display:flex;align-items:center;gap:14px;margin-bottom:12px}.filters select{width:145px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.field{display:block;margin-bottom:17px}.field>span{display:block;margin-bottom:8px;font-size:13px}.error{display:block;color:var(--red);font-size:12px;margin-top:6px;min-height:0}.help{font-size:12px;color:var(--muted);line-height:1.8;margin-top:12px}.category-list{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.category-tag{padding:8px 11px;background:#252b42;border-radius:9px;display:flex;gap:10px;align-items:center}.category-tag button{padding:0 5px;border:0;background:transparent;color:var(--red)}dialog{border:1px solid #45415f;border-radius:20px;background:#181d30;color:inherit;padding:27px;width:min(480px,calc(100% - 28px));max-height:90dvh;overflow:auto}dialog::backdrop{background:#060811bb;backdrop-filter:blur(5px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.dialog-head h2{font-size:21px;margin:0}.close{padding:5px 10px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}.type-switch{display:flex;gap:10px;margin-bottom:22px}.type-switch button{flex:1}.type-switch .selected{border-color:var(--purple);background:#342c56}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:13px 22px;background:#343150;border:1px solid #746799;border-radius:12px;z-index:5;box-shadow:0 10px 35px #0005}.storage-warning{background:#4a2634;color:#ffd1db;padding:15px;margin-bottom:20px;border-radius:10px}.note{overflow-wrap:anywhere;max-width:420px}[hidden]{display:none!important}
@media(max-width:1100px){main{padding:28px 24px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}aside{width:210px}main{margin-left:210px}}@media(max-width:700px){aside{inset:auto 0 0;width:100%;height:72px;padding:7px 8px;z-index:3;border-top:1px solid var(--line);border-right:0}.brand,aside .subtitle,aside footer{display:none}nav{display:flex;margin:0;gap:3px;justify-content:space-around}nav button{text-align:center;font-size:12px;padding:12px 6px;flex:1}main{margin:0;padding:24px 16px 100px}.top{align-items:flex-start;flex-direction:column;gap:17px}.top h1{font-size:25px}.actions{width:100%}.actions input{flex:1;width:140px}.cards{gap:10px}.card{padding:16px}.card .value{font-size:22px}.panel{padding:19px}.settings-grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-wrap:wrap}.row-actions{margin-left:auto;flex-wrap:wrap}.toast{bottom:88px;max-width:92%;width:max-content}.chart-wrap{gap:18px}.eyebrow{margin-top:3px}}
</style></head><body>
<aside><div class="brand"><span class="logo">W</span>Student Wallet</div><p class="subtitle" style="font-size:12px;margin-left:45px">學生生活費管家</p><nav aria-label="主選單"><button data-page="home" class="active">◈　首頁總覽</button><button data-page="transactions">⇄　收支紀錄</button><button data-page="analytics">◔　支出分析</button><button data-page="settings">⚙　設定</button></nav><footer>YOUR MONEY, YOUR PACE.<br>從今天的一筆開始，掌握生活節奏。<br><span class="badge">V1.0 · 本機帳本</span></footer></aside>
<main><div class="top"><div><div class="eyebrow">STUDENT WALLET / PERSONAL FINANCE</div><h1 id="page-title">首頁總覽</h1><div class="muted" id="page-description">讓每一筆生活費，都有清楚的去向。</div></div><div class="actions"><input id="month" type="month" aria-label="選取月份"><button class="primary" id="add">＋ 新增紀錄</button></div></div><div id="storage-warning" class="storage-warning" role="alert" hidden></div><section id="content" aria-label="頁面內容"></section></main>
<dialog id="transaction-dialog" aria-labelledby="dialog-title"><form id="transaction-form" novalidate><div class="dialog-head"><h2 id="dialog-title">新增紀錄</h2><button type="button" class="close" id="close-dialog" aria-label="關閉">×</button></div><div class="type-switch" aria-label="收支類型"><button type="button" data-type="expense" class="selected" aria-pressed="true">支出</button><button type="button" data-type="income" aria-pressed="false">收入</button></div><label class="field"><span>金額（NT$）*</span><input id="amount" inputmode="numeric" placeholder="例如 150" autocomplete="off" aria-describedby="amount-error"><span id="amount-error" class="error"></span></label><label class="field"><span>分類 *</span><select id="category" aria-describedby="category-error"></select><span id="category-error" class="error"></span></label><label class="field"><span>日期 *</span><input id="date" type="date" aria-describedby="date-error"><span id="date-error" class="error"></span></label><label class="field"><span>備註（選填，最多 100 字）</span><input id="note" maxlength="100" placeholder="例如：和同學吃午餐" aria-describedby="note-error"><span id="note-error" class="error"></span></label><div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">儲存紀錄</button></div></form></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='student-wallet-v1', defaults=['餐飲','交通','娛樂','購物','住宿','其他'], incomes=['生活費','打工薪水','獎學金','其他收入'], colors=['#9381ff','#6cafff','#5cddb2','#ffd17a','#ff859c','#d395ef','#6bdbec','#edaa76'];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, money=n=>'NT$ '+n.toLocaleString('zh-TW'), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={transactions:[],budgets:{},categories:[]}, page='home',month=today().slice(0,7),filter='all',editing=null,type='expense',returnFocus=null,toastTimer,storageBlocked=false;
function warn(text){$('storage-warning').textContent=text;$('storage-warning').hidden=false}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===s}
function validInteger(s,min){return /^\d+$/.test(s)&&Number.isSafeInteger(Number(s))&&Number(s)>=min}
try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(!v||!Array.isArray(v.transactions)||!Array.isArray(v.categories)||!v.budgets||typeof v.budgets!=='object')throw Error();if(v.categories.some(c=>!c||typeof c.id!=='string'||typeof c.name!=='string'||!c.name.trim()||c.name.length>15)||v.transactions.some(t=>!t||typeof t.id!=='string'||!['expense','income'].includes(t.type)||!Number.isSafeInteger(t.amount)||t.amount<=0||!validDate(t.date)||typeof t.note!=='string'||t.note.length>100||typeof t.category!=='string'||!Number.isFinite(t.createdAt))||Object.entries(v.budgets).some(([m,b])=>!/^\d{4}-(0[1-9]|1[0-2])$/.test(m)||!Number.isSafeInteger(b)||b<0))throw Error();state=v}}catch(e){storageBlocked=true;warn('無法讀取本機資料。為保護既有紀錄，已暫停儲存；請檢查瀏覽器儲存權限或保留原資料後再處理。')}
function persist(next){if(storageBlocked){showToast('目前無法儲存，請先處理上方資料提示。');return false}try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true}catch(e){warn('儲存失敗：請檢查瀏覽器是否允許本機儲存及可用空間。這次變更未儲存。');return false}}
const clone=()=>JSON.parse(JSON.stringify(state));const uuid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);const expenseCategories=()=>[...defaults,...state.categories.map(c=>c.name)];
function showToast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3000)}
function records(){return state.transactions.filter(t=>t.date.slice(0,7)===month).sort((a,b)=>b.date.localeCompare(a.date)||a.createdAt-b.createdAt||a.id.localeCompare(b.id))}
function stats(){const list=records(),income=list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),expense=list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),budget=Object.hasOwn(state.budgets,month)?state.budgets[month]:null;return {list,income,expense,budget}}
function budgetStatus(b,e){if(b===null)return {text:'尚未設定本月預算',color:'var(--purple)',pct:null,width:0};if(b===0)return {text:e>0?'已超出預算 '+money(e):'預算為 NT$ 0，目前無支出',color:e>0?'var(--red)':'var(--purple)',pct:null,width:e>0?100:0};const p=e/b*100;return {text:p>100?'已超出預算 '+money(e-b):p===100?'本月預算已用完':p>=80?'本月預算即將用完':'預算使用正常，保持你的節奏。',color:p>=100?'var(--red)':p>=80?'var(--yellow)':'var(--purple)',pct:p,width:Math.min(100,p)}}
function empty(text){return `<div class="empty"><div class="symbol">◈</div>${text}</div>`}
function transactionRows(list){return list.length?list.map(t=>`<div class="row"><div><div class="row-title">${esc(t.category)} <span class="badge">${t.type==='income'?'收入':'支出'}</span></div><small>${esc(t.date)}</small>${t.note?`<div class="note muted" style="font-size:12px;margin-top:6px">${esc(t.note)}</div>`:''}</div><div class="row-actions"><span class="amount ${t.type}">${t.type==='income'?'+':'−'}${money(t.amount)}</span><button data-edit="${esc(t.id)}" aria-label="編輯 ${esc(t.category)} ${t.amount} 元">編輯</button><button class="danger" data-delete="${esc(t.id)}" aria-label="刪除 ${esc(t.category)} ${t.amount} 元">刪除</button></div></div>`).join(''):empty('這個月還沒有紀錄。<br>點選「＋ 新增紀錄」，開始記下第一筆。')}
function groups(){const map=new Map();records().filter(t=>t.type==='expense').forEach(t=>map.set(t.category,(map.get(t.category)||0)+t.amount));return [...map].sort((a,b)=>b[1]-a[1])}
function chart(){const g=groups(),total=g.reduce((s,x)=>s+x[1],0);if(!total)return empty('本月尚無支出資料');let pos=0;const gradient=g.map((x,i)=>{const start=pos;pos+=x[1]/total*100;return `${colors[i%colors.length]} ${start}% ${pos}%`}).join(',');return `<div class="chart-wrap"><div class="donut" role="img" aria-label="分類支出圓餅圖，總支出 ${total} 元；${esc(g.map(x=>x[0]+' '+(x[1]/total*100).toFixed(1)+'%').join('、'))}" style="background:conic-gradient(${gradient})"><div class="donut-center"><small>總支出</small><strong>${money(total)}</strong></div></div><div class="legend">${g.map((x,i)=>`<div class="row"><div><span class="dot" style="background:${colors[i%colors.length]}"></span>${esc(x[0])}<div class="muted" style="font-size:12px;margin:6px 0 0 18px">${(x[1]/total*100).toFixed(1)}%</div></div><strong>${money(x[1])}</strong></div>`).join('')}</div></div>`}
function render(){const s=stats();const titles={home:['首頁總覽','讓每一筆生活費，都有清楚的去向。'],transactions:['收支紀錄','記下日常，也掌握每個月的變化。'],analytics:['支出分析','看看你的生活費，主要花在哪裡。'],settings:['設定','依照自己的生活，安排預算與分類。']};$('page-title').textContent=titles[page][0];$('page-description').textContent=titles[page][1];$('month').value=month;document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});let html='';if(page==='home'){const bs=budgetStatus(s.budget,s.expense);html=`<div class="cards">${[['剩餘預算',s.budget===null?'未設定':money(s.budget-s.expense),'預算 − 支出',''],['本月收入',money(s.income),'收入不會自動增加預算','income'],['本月支出',money(s.expense),`${s.list.filter(t=>t.type==='expense').length} 筆支出紀錄`,'expense'],['本月預算',s.budget===null?'未設定':money(s.budget),'每個月獨立設定','']].map(x=>`<div class="card"><small>${x[0]}</small><div class="value ${x[3]}">${x[1]}</div><small>${x[2]}</small></div>`).join('')}</div><div class="grid"><div class="panel"><div class="panel-head"><h2>預算使用狀態</h2><button data-go="settings">設定預算 ↗</button></div><div class="progress" aria-label="預算使用進度"><span style="width:${bs.width}%;background:${bs.color}"></span></div><div class="panel-head"><small>已支出 ${money(s.expense)}</small><strong style="color:${bs.color}">${bs.pct===null?'—':bs.pct.toFixed(1)+'%'}</strong></div><div class="notice" style="color:${bs.color};margin-top:18px" role="status">${bs.text}</div><p class="help">剩餘預算是本月可支出的額度，不代表帳戶餘額。</p></div><div class="panel"><div class="panel-head"><h2>支出分布</h2><button data-go="analytics">查看分析 ↗</button></div>${chart()}</div></div><div class="panel" style="margin-top:22px"><div class="panel-head"><h2>最近五筆交易</h2><button data-go="transactions">全部紀錄 ↗</button></div>${transactionRows(s.list.slice(0,5))}</div>`}else if(page==='transactions'){html=`<div class="panel"><div class="filters"><select id="filter" aria-label="收支類型篩選"><option value="all">全部類型</option><option value="expense">支出</option><option value="income">收入</option></select><span class="muted">${s.list.filter(t=>filter==='all'||t.type===filter).length} 筆紀錄</span></div>${transactionRows(s.list.filter(t=>filter==='all'||t.type===filter))}</div>`}else if(page==='analytics'){html=`<div class="panel"><h2>${esc(month)} · 分類支出比例</h2>${chart()}<p class="help">比例依當月總支出計算，收入不列入圖表。百分比四捨五入至小數點後一位。</p></div>`}else{html=`<div class="settings-grid"><div class="panel"><h2>每月預算</h2><p class="muted">目前設定月份：${esc(month)}</p><form id="budget-form" novalidate><label class="field"><span>支出預算（NT$）</span><input id="budget-input" inputmode="numeric" value="${s.budget===null?'':s.budget}" placeholder="輸入 0 或正整數" aria-describedby="budget-error"><span class="error" id="budget-error"></span></label><button class="primary" type="submit">儲存預算</button> <button type="button" id="unset-budget">取消本月預算設定</button></form><p class="help">每月預算互不影響。未設定與 0 元預算是不同狀態；收入不會改變預算。</p></div><div class="panel"><h2>支出分類</h2><form id="category-form" novalidate><label class="field"><span>新增自訂分類（最多 15 字）</span><input id="new-category" maxlength="15" placeholder="例如：健身、旅遊" aria-describedby="new-category-error"><span class="error" id="new-category-error"></span></label><button class="primary" type="submit">＋ 新增分類</button></form><div class="category-list">${defaults.map(c=>`<span class="category-tag">${c}</span>`).join('')}${state.categories.map(c=>`<span class="category-tag">${esc(c.name)}<button data-remove-category="${esc(c.id)}" aria-label="刪除分類 ${esc(c.name)}">×</button></span>`).join('')}</div><p class="help">預設分類無法刪除。刪除自訂分類後，既有交易會保留並改歸「其他」。</p></div></div><div class="panel" style="margin-top:22px"><h2>你的本機帳本</h2><p class="muted" style="line-height:1.9">資料保存在目前網站與瀏覽器中，重新整理後仍可使用。更換裝置或瀏覽器、無痕模式及清除網站資料，可能導致資料無法保留。本版沒有帳號登入或雲端同步。</p></div>`}$('content').innerHTML=html;if(page==='transactions')$('filter').value=filter}
function switchPage(p){page=p;render()}
function setType(t,category){type=t;document.querySelectorAll('[data-type]').forEach(b=>{b.classList.toggle('selected',b.dataset.type===t);b.setAttribute('aria-pressed',String(b.dataset.type===t))});$('category').innerHTML=(t==='expense'?expenseCategories():incomes).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(category)$('category').value=category}
function openDialog(id=null){editing=id;const t=state.transactions.find(t=>t.id===id);returnFocus=document.activeElement;$('transaction-form').reset();['amount','category','date','note'].forEach(x=>{$(x+'-error').textContent='';$(x).removeAttribute('aria-invalid')});$('dialog-title').textContent=t?'編輯紀錄':'新增紀錄';setType(t?.type||'expense',t?.category);$('amount').value=t?.amount||'';$('date').value=t?.date||today();$('note').value=t?.note||'';$('transaction-dialog').showModal();$('amount').focus()}
function closeDialog(){$('transaction-dialog').close();returnFocus?.focus()}
$('transaction-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});$('close-dialog').onclick=closeDialog;$('cancel').onclick=closeDialog;$('add').onclick=()=>openDialog();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>setType(b.dataset.type));$('month').onchange=e=>{if(/^\d{4}-(0[1-9]|1[0-2])$/.test(e.target.value)){month=e.target.value;render()}else e.target.value=month};
$('transaction-form').onsubmit=e=>{e.preventDefault();const amount=$('amount').value.trim(),date=$('date').value,category=$('category').value,note=$('note').value.trim();const errors={amount:validInteger(amount,1)?'':'請輸入大於 0 的整數，不接受小數、負數或其他符號。',date:validDate(date)?'':'請選擇有效日期。',category:(type==='expense'?expenseCategories():incomes).includes(category)?'':'請選擇分類。',note:note.length<=100?'':'備註最多 100 字。'};for(const [k,v]of Object.entries(errors)){$(k+'-error').textContent=v;$(k).setAttribute('aria-invalid',String(!!v))}const bad=Object.keys(errors).find(k=>errors[k]);if(bad){$(bad).focus();return}const next=clone(),old=next.transactions.find(t=>t.id===editing),record={id:old?.id||uuid(),type,amount:Number(amount),category,date,note,createdAt:old?.createdAt||Date.now()};if(old)next.transactions[next.transactions.indexOf(old)]=record;else next.transactions.push(record);if(persist(next)){closeDialog();render();showToast(old?'紀錄已更新':'紀錄已儲存'+(date.slice(0,7)!==month?'（屬於 '+date.slice(0,7)+'）':''))}};
$('content').addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}});
$('content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)switchPage(b.dataset.go);if(b.dataset.edit)openDialog(b.dataset.edit);if(b.dataset.delete){const t=state.transactions.find(t=>t.id===b.dataset.delete);if(confirm(`確定刪除 ${t.date} 的「${t.category}」${money(t.amount)} 紀錄？`)){const next=clone();next.transactions=next.transactions.filter(x=>x.id!==t.id);if(persist(next)){render();showToast('紀錄已刪除')}}}if(b.dataset.removeCategory){const c=state.categories.find(c=>c.id===b.dataset.removeCategory),count=state.transactions.filter(t=>t.type==='expense'&&t.category===c.name).length;if(confirm(`確定刪除「${c.name}」分類？${count} 筆既有交易將保留並改歸「其他」。`)){const next=clone();next.categories=next.categories.filter(x=>x.id!==c.id);next.transactions.forEach(t=>{if(t.type==='expense'&&t.category===c.name)t.category='其他'});if(persist(next)){render();showToast('分類已刪除，交易已保留')}}}if(b.id==='unset-budget'&&confirm('確定取消 '+month+' 的預算設定？')){const next=clone();delete next.budgets[month];if(persist(next)){render();showToast('本月預算已改為未設定')}}});
$('content').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='budget-form'){const value=$('budget-input').value.trim();if(!validInteger(value,0)){$('budget-error').textContent='請輸入大於或等於 0 的整數。';$('budget-input').focus();return}const next=clone();next.budgets[month]=Number(value);if(persist(next)){render();showToast('已儲存 '+month+' 的預算')}}if(e.target.id==='category-form'){const name=$('new-category').value.trim();let error=!name?'分類名稱不能空白。':name.length>15?'分類名稱最多 15 字。':expenseCategories().some(c=>c.normalize('NFKC').toLowerCase()===name.normalize('NFKC').toLowerCase())?'已有同名分類。':'';if(error){$('new-category-error').textContent=error;$('new-category').focus();return}const next=clone();next.categories.push({id:uuid(),name});if(persist(next)){render();showToast('自訂分類已新增')}}});
window.addEventListener('storage',e=>{if(e.key===KEY)location.reload()});render();
</script></body></html>
